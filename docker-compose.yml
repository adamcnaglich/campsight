# CampSight — Portainer stack
#
# Single container: Express serves the API and the built web app on one port,
# SQLite lives on the `campsight-data` volume. No sign-in; keep it LAN-only.
#
# Deploy it from Portainer with the Repository method (this repo's URL, compose
# path docker-compose.yml): Portainer clones the repo and builds the image on
# the Docker host, so no registry is needed. The first deploy takes a few
# minutes while Nx compiles both apps. Docker needs BuildKit (Docker 23+).
#
# Stack environment variables (Portainer → Stacks → Environment variables, or
# "Load variables from .env file" with stack.env): see stack.env.example.

services:
  campsight:
    build: .
    image: campsight:latest
    container_name: campsight
    restart: unless-stopped
    ports:
      - "${CAMPSIGHT_PORT:-3333}:3333"
    environment:
      # Where availability alerts are sent
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:?NOTIFY_EMAIL is required}
      # SMTP server that delivers the alert emails
      # (iCloud: smtp.mail.me.com, port 587, Apple ID + app-specific password)
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      # Optional: sender address (defaults to "CampSight <SMTP_USER>") and TLS override
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Recreation.gov RIDB key (https://ridb.recreation.gov), used for campground details
      RIDB_API_KEY: ${RIDB_API_KEY:?RIDB_API_KEY is required}
      # Optional: Google Maps JavaScript API key for the campsite map (list view works without it)
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Optional: state shown in the "available near you" strip
      HOME_REGION: ${HOME_REGION:-Michigan}
      # Optional: how often to poll Recreation.gov (cron expression)
      CHECK_INTERVAL: ${CHECK_INTERVAL:-*/15 * * * *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - campsight-data:/data

volumes:
  campsight-data:
